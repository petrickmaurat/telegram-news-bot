name: Digest por e-mail (1x ao dia)

on:
  schedule:
    - cron: "0 12 * * *"  # ~09:00 no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

# Evita que um disparo manual coincida com o automático e mande o
# digest (e cobre a IA) duas vezes: a segunda execução espera a
# primeira terminar em vez de rodar em paralelo.
concurrency:
  group: news-bot-state-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      BOT_PERSIST_STATE: "1"
      BOT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests

      - run: python digest_email.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}

      - name: Salvar estado mesmo após falha parcial
        if: ${{ always() }}
        run: python persist_state.py

      - name: Preservar estado para recuperação
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: estado-digest-${{ github.run_id }}
          path: |
            enviados.json
            digest_enviados.json
            google_cache.json
            digest_fila.json
            telegram_incerto.json
            digest_incerto.json
            digest_auditoria.json
          retention-days: 14
