name: Digest por e-mail (1x ao dia)

on:
  schedule:
    - cron: "0 12 * * *"  # ~09:00 no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

# Evita que um disparo manual coincida com o automático e mande o
# digest (e cobre a IA) duas vezes: a segunda execução espera a
# primeira terminar em vez de rodar em paralelo.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python digest_email.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}

      - name: Salvar estado do digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digest_enviados.json google_cache.json
          git diff --staged --quiet && exit 0
          git commit -m "Atualiza digest_enviados.json"
          git pull --rebase --autostash
          git push
