name: Preparar entrada V2 (sem IA)
run-name: Preparar entrada V2 integral — execução ${{ github.run_number }}

# Sem agendamento do GitHub: ele atrasou horas e deixou a Routine das 07h sem
# entrada. A própria Routine pede a coleta com um push em claude/v2-coleta-*
# (routine_v2.py request-input), que dispara este workflow na hora.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2-claude-routines
      - "claude/v2-coleta-**"
    paths:
      - .github/workflows/v2_prepare.yml
      - routine_v2.py
      - routine_v2_trigger.txt
      - common.py
      - digest_email.py
      - requirements.txt
      - tests/test_routine_v2.py
      - tests/test_email.py

permissions:
  contents: write

concurrency:
  group: v2-prepare-input
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar a V2
        uses: actions/checkout@v4
        with:
          ref: v2-claude-routines
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar a V2
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verificar acesso às fontes
        run: python routine_v2.py preflight

      - name: Preparar todos os candidatos sem usar IA
        run: python routine_v2.py prepare --max-new-per-topic 0

      - name: Validar o arquivo que o Claude receberá
        run: python routine_v2.py load-input --max-age-hours 2

      - name: Salvar entrada na branch V2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- routine_v2_input.json routine_v2_state.json routine_v2_google_cache.json routine_v2_preflight.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de entrada para publicar."
          else
            git commit -m "Prepara entrada V2 sem IA"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin v2-claude-routines && git push origin HEAD:v2-claude-routines; then
                pushed=1; break
              fi
              sleep $((attempt * 5))
            done
            [ "$pushed" = 1 ] || { echo "Não foi possível publicar na v2-claude-routines."; exit 1; }
          fi

      - name: Apagar branch do pedido de coleta
        if: ${{ always() && startsWith(github.ref_name, 'claude/v2-coleta-') }}
        run: git push origin --delete "${{ github.ref_name }}"
