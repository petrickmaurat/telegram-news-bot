name: Checar notícias de data center

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-bot-state-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  checar:
    runs-on: ubuntu-latest
    env:
      BOT_PERSIST_STATE: "1"
      BOT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests

      - run: python telegram_news_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Salvar estado mesmo após falha parcial
        if: ${{ always() }}
        run: python persist_state.py

      - name: Preservar estado para recuperação
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: estado-news-${{ github.run_id }}
          path: |
            enviados.json
            digest_enviados.json
            google_cache.json
            digest_fila.json
            telegram_incerto.json
            digest_incerto.json
          retention-days: 14
